[project]
name = "digitallydefined-fastapi"
version = "0.1.0"
description = "FastAPI microservice layer for DigitallyDefined — product/niche/domain/affiliate/rank-rent/blueprint/roadmap/trends microservices."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.uv]
default-version = "3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]