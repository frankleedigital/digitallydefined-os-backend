# ============================================================================
# OmniRoute -> Hermes wiring (DigitallyDefined AI gateway running locally in Docker)
# ============================================================================
#
# Canonical endpoint (OmniRoute served locally under /v1/):
#   Base URL : http://localhost:20128/v1
#   Chat     : http://localhost:20128/v1/chat/completions
#   API Key  : sk-fcfcf4cfe8fd70e5-91efab-2cbad170
#   Model    : auto
#
# ---------------------------------------------------------------------------
# STEP 1 — put these in ~/.hermes/.env   (C:\Users\frank\.hermes\.env)
# ---------------------------------------------------------------------------
#   OMNIROUTE_API_KEY=sk-fcfcf4cfe8fd70e5-91efab-2cbad170
#   OMNIROUTE_BASE_URL=http://localhost:20128/v1
#   OMNIROUTE_MODEL=auto
#
# ---------------------------------------------------------------------------
# STEP 2 — confirm which config.yaml Hermes actually reads:
#   C:\Users\frank\.hermes\config.yaml          (Buzz docs use ~/.hermes/)
#   C:\Users\frank\AppData\Local\hermes\config.yaml
#
# ---------------------------------------------------------------------------
# STEP 3 — RECOMMENDED: OpenAI-compatible provider (makes Hermes call models
# directly). Add under the top-level `models:` (or `providers:`) section:
# ---------------------------------------------------------------------------
# models:
#   omniroute:
#     type: openai-compatible
#     base_url: http://localhost:20128/v1
#     api_key: ${OMNIROUTE_API_KEY}
#     models:
#       - auto
#     default: true
#
# # then set the active model (top-level or under your agent section):
# model: omniroute/auto
#
# ---------------------------------------------------------------------------
# STEP 4 (alternative) — register as an MCP server. Paste this block under the
# EXISTING `mcp_servers:` section, at the same indent level as linear/tavily.
# (NOTE the key is `mcp_servers`, correctly spelled — a previous version of
#  this file had `mmcpServers:` which silently fails to load.)
# ---------------------------------------------------------------------------

mcp_servers:
  omniroute:
    type: sse
    url: http://localhost:20128/v1/mcp/sse
    auth: bearer
    api_key_env: OMNIROUTE_API_KEY
    default_model: auto
    allowed_tools:
      - models.list
      - chat.completions.create
    timeout_ms: 60000

